[project]
name = "ai-anti-duplicate"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "numpy>=1.26",
    "PySide6-Essentials>=6.6",
]

[tool.uv]
package = false

[dependency-groups]
# только для разработчика: экспорт и проверка модели (scripts/)
export = ["torch>=2.2", "sentence-transformers>=3.0", "onnx", "onnxconverter-common"]
dev = ["pytest"]
