[project]
name = "photo-duplicate-finder-ai"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "onnxruntime>=1.18,<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.18; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "onnxruntime-directml>=1.18; sys_platform == 'win32'",
    "pillow>=10.0",
    "rawpy>=0.21",
    "numpy>=1.26",
    "PySide6-Essentials>=6.6",
]

[tool.uv]
package = false

[dependency-groups]
# только для разработчика: экспорт и проверка модели (scripts/)
export = ["torch>=2.2", "sentence-transformers>=3.0", "onnx", "onnxconverter-common"]
dev = ["pytest"]
