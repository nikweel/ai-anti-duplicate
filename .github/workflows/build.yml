name: Build
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#app-v}"; [ "$GITHUB_REF_TYPE" = tag ] || V=0.0.0-dev
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Build bundle
        run: uv run --python 3.11 --with pyinstaller pyinstaller --noconfirm packaging.spec
      - name: Linux packages
        if: matrix.name == 'linux'
        run: sh packaging/linux.sh "$APP_VERSION"
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows.iss
      - name: macOS dmg
        if: startsWith(matrix.name, 'macos')
        run: |
          mkdir -p release
          hdiutil create -volname "AI Anti-Duplicate" -srcfolder dist/AI-Anti-Duplicate.app -ov -format UDZO "release/AI-Anti-Duplicate-$APP_VERSION-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
